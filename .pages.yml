content:
  - name: site
    label: Site Content
    type: file
    path: content/data.json
    fields:
      - name: hero
        label: Hero Section
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: line1, label: Headline line 1, type: string }
          - { name: line2, label: Headline line 2, type: string }
          - { name: line3, label: Headline line 3, type: string }
          - { name: sub, label: Subtext, type: text }
          - { name: cta, label: Button text, type: string }
          - { name: image, label: Image key (advanced), type: string }
          - { name: video, label: Video URL (advanced), type: string }
      - name: countdown
        label: Drop Countdown
        type: object
        fields:
          - { name: enabled, label: Show countdown, type: boolean }
          - { name: label, label: Label, type: string }
          - { name: target, label: "Target date/time (YYYY-MM-DDTHH:MM)", type: string }
      - name: products
        label: Products
        type: object
        list: true
        fields:
          - { name: id, label: "ID (unique, no spaces)", type: string }
          - { name: name, label: Name, type: string }
          - { name: cat, label: "Category label (e.g. Hoodie)", type: string }
          - name: type
            label: Type (controls the shop filter)
            type: select
            options:
              values: [hoodie, tee, shirt, pant]
          - { name: price, label: "Price (৳)", type: number }
          - { name: op, label: "Old price (leave blank for none)", type: number }
          - { name: badge, label: "Badge (leave blank for none)", type: string }
          - { name: sizes, label: Sizes, type: string, list: true }
          - name: colors
            label: Colors
            type: object
            list: true
            fields:
              - { name: name, label: Color name, type: string }
              - { name: hex, label: "Hex (e.g. #000000)", type: string }
          - { name: imgs, label: "Image keys (advanced)", type: string, list: true }
          - { name: desc, label: Description, type: text }
          - { name: fabric, label: Fabric & Care, type: text }
